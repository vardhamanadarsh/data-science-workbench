name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra ml --extra automl --extra explain --extra reports

      - name: Run tests
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (not pushed)
        run: docker build -t workbench .